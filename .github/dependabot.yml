version: 2
updates:
  # One lockfile at the root covers the website, extension and shared workspaces.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Shipped and dev-only packages are grouped separately, so a tooling bump
    # that fails CI does not hold back runtime fixes (and vice versa).
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
