name: CI

on:
  push:
    branches: [master]
  pull_request:

# The job only reads the repo. Anything that needs more must ask for it
# explicitly, so a compromised step cannot push code or edit releases.
permissions:
  contents: read

# A new push to a pull request supersedes its older runs. Runs on master are
# never cancelled, so every commit that ships keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `ci` is the required status check in the "PROTECT master" ruleset, so keep
  # this job name and add new checks as steps here rather than as new jobs.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot
      # bumps the SHA and the version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on high/critical advisories in anything that ships to users.
      # Dev-only tooling is left to Dependabot so it cannot block a release.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Create env file
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Pull requests from forks (and Dependabot) do not receive repository
          # secrets. The build only needs valid-shaped values; runtime
          # credentials are not used by CI.
          : "${SUPABASE_URL:=https://ci-placeholder.supabase.co}"
          : "${SUPABASE_ANON_KEY:=ci-placeholder-anon-key}"
          echo "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}" > website/.env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> website/.env.local
          echo "NEXT_PUBLIC_SKIP_EXTENSION_CHECK=true" >> website/.env.local

      # Built before the tests so the dev-extension contract tests run against
      # it instead of skipping.
      - name: Build dev extension
        run: npm run build:extension:dev

      - name: Run tests
        run: npm test

      - name: Lint website
        run: npm run lint:web

      - name: Typecheck website
        run: npm run typecheck -w website

      - name: Build website
        run: npm run build:web
