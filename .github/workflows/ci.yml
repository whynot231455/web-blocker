name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint website
        run: npm run lint:web

      - name: Typecheck website
        run: npm run typecheck -w website

      - name: Create env file
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" > website/.env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> website/.env.local
          echo "NEXT_PUBLIC_SKIP_EXTENSION_CHECK=true" >> website/.env.local

      - name: Build website
        run: npm run build:web

      - name: Build dev extension
        run: npm run build:extension:dev